function loadAll(){ghR(function(e,c){if(e||!c)return;try{RD=JSON.parse(c)}catch(ex){};rk=[];for(var u in RD){var ps=RD[u],pts=0;for(var mid in ps){var r=R[mid];if(r){var p=ps[mid];if(+p.homeScore==r.home&&+p.awayScore==r.away)pts+=3;else if((p.result=="home"&&r.home>r.away)||(p.result=="away"&&r.home<r.away)||(p.result=="draw"&&r.home==r.away))pts+=1}}rk.push({name:u,points:pts})}rk.sort(function(a,b){return b.points-a.points});RA()})}

function refresh(){Q();MY();RA()}
function S(t){document.querySelectorAll(".tt").forEach(function(e){e.classList.remove("s")});var map={q:0,r:1,d:2,m:3,k:4};document.querySelectorAll(".tt")[map[t]].classList.add("s");["q","r","d","m","k"].forEach(function(v){document.getElementById(v).style.display=v===t?"block":"none"});if(t==="q")Q();if(t==="r")RE();if(t==="d")DA();if(t==="m")MY();if(t==="k")RA()}

function Q(){if(!N){document.getElementById("q").innerHTML='<div class="nb"><input class="ni" id="ni" placeholder="你的昵称" maxlength="15"><button class="ns" id="sb">保存</button></div>'+QD();return}document.getElementById("q").innerHTML='<div class="nh">👋<b>'+N+'</b><span class="ne" id="en">[改]</span></div>'+QD()}
function QD(){var t=T(),d={},f=false;M.forEach(function(m){if(m.date<t)return;f=true;(d[m.date]=d[m.date]||[]).push(m)});if(!f)return'<div class="ep">📅 所有比赛已结束</div>';return Object.keys(d).sort().map(function(dt){return'<div class="dt"><span>'+D(dt)+'</span>'+(dt===t?'<span class="ec">📅今天</span>':'')+'</div>'+d[dt].map(function(m){return X(m)}).join("")}).join("")}
function X(m){var p=P[m.id]||{},s=p.result||"";return'<div class="mc"><div class="mt"><span>'+m.st+"·"+m.gr+'</span><span>'+m.ct+'</span></div><div class="md"><div class="tb2"><span class="fl">'+m.hF+'</span><span class="tn">'+m.home+'</span></div><span class="vs">VS</span><div class="tb2"><span class="fl">'+m.aF+'</span><span class="tn">'+m.away+'</span></div></div><div class="pr"><div id="bh_'+m.id+'" class="pb'+(s==="home"?" o":"")+'">'+m.home+'胜</div><div id="bd_'+m.id+'" class="pb'+(s==="draw"?" o":"")+'">平</div><div id="ba_'+m.id+'" class="pb'+(s==="away"?" o":"")+'">'+m.away+'胜</div></div><div class="sr"><input class="si" id="sh_'+m.id+'" type="number" min="0" max="20" value="'+(p.homeScore!=null&&p.homeScore!==""?p.homeScore:"")+'" placeholder="0"><span class="ss">:</span><input class="si" id="sa_'+m.id+'" type="number" min="0" max="20" value="'+(p.awayScore!=null&&p.awayScore!==""?p.awayScore:"")+'" placeholder="0"></div></div>'}
function editName(){N="";localStorage.removeItem(NK);Q()}
function PK(id,r){var p=P[id]||{};p.result=r;if(r==="home"&&(p.awayScore||0)>=(p.homeScore||0)){p.homeScore=Math.max(p.homeScore||0,1);p.awayScore=p.awayScore||0}if(r==="away"&&(p.homeScore||0)>=(p.awayScore||0)){p.homeScore=p.homeScore||0;p.awayScore=Math.max(p.awayScore||0,1)}if(r==="draw"){var avg=Math.max(p.homeScore||0,p.awayScore||0);p.homeScore=p.awayScore=avg}SP(id,r,p.homeScore||0,p.awayScore||0)}
function PS(id,s,v){var val=v===""?"":parseInt(v)||0;var p=P[id]||{};p[s==="h"?"homeScore":"awayScore"]=val;if(p.homeScore!=null&&p.homeScore!==""&&p.awayScore!=null&&p.awayScore!==""){p.result=p.homeScore>p.awayScore?"home":p.homeScore<p.awayScore?"away":"draw"}else p.result="";SP(id,p.result||"",p.homeScore||0,p.awayScore||0);document.getElementById("toast").textContent="已保存";document.getElementById("toast").classList.add("s");setTimeout(function(){document.getElementById("toast").classList.remove("s")},1000)}

function RE(){var t=T(),d={};M.forEach(function(m){if(m.date>=t)return;(d[m.date]=d[m.date]||[]).push(m)});if(!Object.keys(d).length){document.getElementById("r").innerHTML='<div class="ep">暂无已结束比赛</div>';return}document.getElementById("r").innerHTML=Object.keys(d).sort().reverse().map(function(dt){return'<div class="dt"><span>'+D(dt)+'</span></div>'+d[dt].map(function(m){var r=R[m.id];return'<div class="mc x"><div class="mt"><span>'+m.st+"·"+m.gr+'</span></div><div class="md"><div class="tb2"><span class="fl">'+m.hF+'</span><span class="tn">'+m.home+'</span></div><div class="rb">'+(r?r.home+":"+r.away:"--:--")+'</div><div class="tb2"><span class="fl">'+m.aF+'</span><span class="tn">'+m.away+'</span></div></div></div>'}).join("")}).join("")}

function DA(){document.getElementById("d").innerHTML='<div class="ep">📖 资料页开发中</div>'}

function MY(){if(!N){document.getElementById("m").innerHTML='<div class="ep">请先输入昵称</div>';return}var pm=[];for(var i=0;i<M.length;i++)if(P[M[i].id])pm.push(M[i]);pm.sort(function(a,b){return b.date.localeCompare(a.date)});if(!pm.length){document.getElementById("m").innerHTML='<div class="ep">还没竞猜</div>';return}var pts=0,cc=0;for(var mid in P){var p=P[mid],r=R[mid];if(r&&p.result){if(+p.homeScore===r.home&&+p.awayScore===r.away){pts+=3;cc++}else if((p.result==="home"&&r.home>r.away)||(p.result==="away"&&r.home<r.away)||(p.result==="draw"&&r.home===r.away)){pts+=1;cc++}}}var h='<div class="nh">👋<b>'+N+'</b></div><div class="srl"><div class="sc"><span class="sn">'+pm.length+'</span><span class="sl">已猜</span></div><div class="sc"><span class="sn">'+cc+'</span><span class="sl">对</span></div><div class="sc"><span class="sn">'+pts+'</span><span class="sl">得分</span></div></div>';pm.forEach(function(m){var p=P[m.id],r=R[m.id],s="";if(r){var cs=+p.homeScore===r.home&&+p.awayScore===r.away;var cr=(p.result==="home"&&r.home>r.away)||(p.result==="away"&&r.home<r.away)||(p.result==="draw"&&r.home===r.away);s=cs?'<span class="sw">+3</span>':cr?'<span class="sw">+1</span>':'<span style="color:#d45040">+0</span>'}else s='<span style="color:#5a5248">待定</span>';h+='<div class="pi"><span class="pm">'+m.hF+m.home+" vs "+m.away+m.aF+'<br><small style="color:#5a5248">'+m.date+'</small></span><span class="pg">'+(p.result==="home"?m.home:p.result==="away"?m.away:"平")+(p.homeScore!=null&&p.homeScore!==""?" "+p.homeScore+":"+p.awayScore:"")+s+'</span></div>'});document.getElementById("m").innerHTML=h}

function RA(){if(!N){document.getElementById("k").innerHTML='<div class="ep">请先输入昵称</div>';return}rk=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith("picks_")){var un=k.replace("picks_",""),pts=0;try{var ps=JSON.parse(localStorage.getItem(k));for(var mid in ps){var r=R[mid];if(r){var p=ps[mid];if(+p.homeScore===r.home&&+p.awayScore===r.away)pts+=3;else if((p.result==="home"&&r.home>r.away)||(p.result==="away"&&r.home<r.away)||(p.result==="draw"&&r.home===r.away))pts+=1}}rk.push({name:un,points:pts})}catch(e){}}}rk.sort(function(a,b){return b.points-a.points});var h='<div class="srl"><div class="sc"><span class="sn">'+rk.length+'</span><span class="sl">本地用户</span></div></div>'+rk.map(function(u,i){var c=i===0?" r1":i===1?" r2":i===2?" r3":"";return'<div class="ri"><span class="rn'+c+'">'+(i+1)+'</span><span class="rna">'+u.name+'</span><span class="rsc">'+u.points+'分</span></div>'}).join("");document.getElementById("k").innerHTML=h;loadAll()}

// Events
document.addEventListener("click",function(e){
  var id=e.target.id||""
  if(id==="sb"){var inp=document.getElementById("ni");if(inp){var v=inp.value.trim();if(v){N=v;localStorage.setItem(NK,v);init()}}}
  if(id==="en")editName()
  if(id.startsWith("bh_"))PK(+id.slice(3), "home")
  if(id.startsWith("bd_"))PK(+id.slice(3), "draw")
  if(id.startsWith("ba_"))PK(+id.slice(3), "away")
  // Tab switching via data-tab
  if(e.target.getAttribute("data-tab"))S(e.target.getAttribute("data-tab"))
})
document.addEventListener("change",function(e){
  var id=e.target.id||""
  if(id.startsWith("sh_"))PS(+id.slice(3), "h", e.target.value)
  if(id.startsWith("sa_"))PS(+id.slice(3), "a", e.target.value)
})

setTimeout(function(){init();chkT()}, 50)
</script></body></html>
