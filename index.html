<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>世界杯竞猜</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC",sans-serif;background:#0c0b09;color:#ede7df;padding-bottom:20px}
.hdr{background:#12100e;padding:12px 16px;text-align:center;border-bottom:1px solid #1e1c18}.hdr h1{font-size:20px;color:#e89820}
.tb{display:flex;background:#100e0c;position:sticky;top:0;z-index:10;border-bottom:1px solid #1e1c18}
.tt{padding:10px;font-size:13px;color:#7a7268;cursor:pointer;text-align:center;flex:1;border-bottom:2px solid transparent;user-select:none}.tt.on{color:#e89820;border-bottom-color:#e89820}
.pg{padding:10px 12px;max-width:600px;margin:0 auto}
.dt{background:#1e1c18;border-radius:6px;padding:8px 12px;margin:8px 0 6px;font-size:13px;font-weight:600}
.mc{background:#12100e;border-radius:8px;padding:10px;margin-bottom:6px}.mc.pst{opacity:.4}
.mt{font-size:10px;color:#5a5248;margin-bottom:4px}.md{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tm{text-align:center}.fl{font-size:22px}.tn{font-size:12px;font-weight:600;display:block}.vs{font-size:11px;color:#5a5248}
.pr{display:flex;gap:4px;margin-bottom:4px}.pb{flex:1;padding:5px;border:1px solid #1e1c18;border-radius:4px;font-size:10px;color:#7a7268;cursor:pointer;text-align:center}.pb.sel{background:rgba(232,152,32,.18);border-color:#e89820;color:#e89820}
.sr{display:flex;justify-content:center;gap:4px}.si{width:32px;height:28px;background:#1e1c18;border:1px solid #2a2824;border-radius:4px;color:#ede7df;text-align:center;font-size:13px}.si:focus{outline:1px solid #e89820}
.rb{background:rgba(60,184,120,.12);border:1px solid #3cb878;color:#3cb878;padding:2px 6px;border-radius:4px;font-size:11px}
.ni{flex:1;background:#1e1c18;border:1px solid #2a2824;border-radius:5px;padding:8px;color:#ede7df;font-size:13px}
.ns{background:#e89820;color:#fff;border:none;border-radius:5px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.nh{font-size:13px;margin-bottom:6px}.ne{font-size:10px;color:#e89820;cursor:pointer}
.srl{display:flex;gap:6px;margin-bottom:8px}.sc{flex:1;background:#12100e;border-radius:6px;padding:8px;text-align:center}
.sn{font-size:18px;font-weight:700;color:#e89820}.sl{font-size:10px;color:#7a7268}
.ri{display:flex;align-items:center;background:#12100e;border-radius:6px;padding:8px;margin-bottom:4px;gap:8px}
.rn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#1e1c18;color:#e89820}
.rn.r1{background:linear-gradient(135deg,#e89820,#c47a10);color:#fff}
.rna{flex:1;font-size:12px;font-weight:600}.rsc{font-size:13px;font-weight:700;color:#e89820}
.ep{text-align:center;padding:30px;color:#7a7268;font-size:12px}
</style></head><body>
<div class="hdr"><img src="Pictures/logo.jpg" style="width:40px;height:40px;border-radius:10px;border:2px solid #e89820;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'"><span style="vertical-align:middle">🏆 2026 AFC 世界杯竞猜</span></div>
<div class="tb"><div class="tt on" onclick="S(0)">📋竞猜</div><div class="tt" onclick="S(1)">📊战报</div><div class="tt" onclick="S(3)">🎯我的</div><div class="tt" onclick="S(4)">🏅排行</div></div>
<div id="v0" class="pg"></div><div id="v1" class="pg" style="display:none"></div><div id="v3" class="pg" style="display:none"></div><div id="v4" class="pg" style="display:none"></div>
<script src="app.js"></script>
</body></html>
